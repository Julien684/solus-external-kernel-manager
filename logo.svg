<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd3dd"/>
      <stop offset="0.5" stop-color="#8b95a5"/>
      <stop offset="1" stop-color="#5c6470"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b23c"/>
      <stop offset="1" stop-color="#e58a1a"/>
    </linearGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="64" cy="118" rx="34" ry="6" fill="#000" opacity="0.18"/>

  <!-- Corps -->
  <ellipse cx="64" cy="74" rx="33" ry="43" fill="#14181e"/>
  <!-- Ailes -->
  <ellipse cx="33" cy="70" rx="11" ry="23" fill="#14181e"/>
  <ellipse cx="95" cy="70" rx="11" ry="23" fill="#14181e"/>
  <!-- Ventre -->
  <ellipse cx="64" cy="82" rx="23" ry="31" fill="#f5f6f7"/>
  <!-- Pieds -->
  <ellipse cx="47" cy="112" rx="12" ry="6.5" fill="url(#orange)"/>
  <ellipse cx="81" cy="112" rx="12" ry="6.5" fill="url(#orange)"/>

  <!-- Tête -->
  <circle cx="64" cy="37" r="20" fill="#14181e"/>
  <!-- Yeux -->
  <ellipse cx="56" cy="32" rx="6.5" ry="7" fill="#f5f6f7"/>
  <ellipse cx="72" cy="32" rx="6.5" ry="7" fill="#f5f6f7"/>
  <circle cx="57" cy="33" r="3" fill="#10131a"/>
  <circle cx="73" cy="33" r="3" fill="#10131a"/>
  <circle cx="58.5" cy="31.5" r="1" fill="#fff"/>
  <circle cx="74.5" cy="31.5" r="1" fill="#fff"/>
  <!-- Bec -->
  <path d="M 57 42 L 71 42 L 64 49 Z" fill="url(#orange)"/>

  <!-- ===== Clé à molette (main droite de Tux) =====
       poignée diagonale ↘ / mâchoire ouverte en haut-gauche face au bec.
  -->
  <g transform="translate(84,64) rotate(38)">
    <!-- Poignée -->
    <rect x="-5" y="8" width="10" height="52" rx="5" fill="url(#steel)"/>
    <rect x="-5" y="8" width="4" height="52" rx="2" fill="#e3e8ef" opacity="0.55"/>
    <!-- Lanière (collier) -->
    <rect x="-7.5" y="2" width="15" height="8" rx="3" fill="url(#steel)"/>
    <!-- Tête : U ouvert vers le haut (mâchoires) -->
    <path d="M -12 -12
             L -12 -2
             Q -12 6 0 6
             Q 12 6 12 -2
             L 12 -12
             L 6.5 -12
             L 6.5 -1
             Q 6.5 1 0 1
             Q -6.5 1 -6.5 -1
             L -6.5 -12 Z" fill="url(#steel)"/>
    <!-- arête intérieure sombre (ouverture) -->
    <rect x="-4.5" y="-12" width="9" height="12" fill="#4c5460" opacity="0.55"/>
  </g>
</svg>
