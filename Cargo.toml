[package]
name = "solus-external-kernel-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Gestionnaire graphique (Qt6) des noyaux externes (CachyOS, Zen, Liquorix) pour Solus"
license = "GPL-3.0-or-later"

[dependencies]
qtrs = "0.5.9"
cxx = "1.0"
ureq = { version = "2", features = ["json", "tls"] }
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"

[profile.release]
opt-level = 3
strip = true
